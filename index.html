<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inazuma Eleven Wordle Diario</title>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('fondo.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        header h1 {
            color: white;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Dificultad */
        .modos-dificultad {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-modo {
            padding: 10px 20px;
            border: 2px solid #cbd5e1;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-modo.activo {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Panel de días */
        .panel-dias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-dia {
            padding: 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-dia:hover {
            background: #cbd5e1;
        }

        .btn-dia.activo {
            background: #64748b;
            color: white;
        }

        .btn-dia.completado {
            background: var(--success) !important;
            color: white;
        }

        /* Instrucciones y Avisos */
        .instrucciones {
            text-align: center;
            font-weight: 500;
            margin-bottom: 15px;
            color: #475569;
        }

        .aviso-bloqueado {
            display: none;
            text-align: center;
            padding: 20px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Buscador y Sugerencias */
        .buscador-zona {
            display: none;
            position: relative;
            margin-bottom: 20px;
        }

        .input-buscar {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        .sugerencias-caja {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #cbd5e1;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .sugerencia-item {
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .sugerencia-item:hover {
            background: #f1f5f9;
        }

        /* Alerta Victoria */
        .alerta-victoria {
            display: none;
            background: #dcfce7;
            color: #14532d;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 18px;
        }

        /* Tabla de Intentos */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        th {
            background: #f1f5f9;
            color: #475569;
        }

        .verde {
            background-color: #28a745 !important;
            color: white;
        }

        .rojo {
            background-color: #dc3545 !important;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Inazuma Eleven Guessing Game ⚡</h1>
    </header>

    <div class="container">
        <!-- Selector de Dificultad -->
        <div class="modos-dificultad">
            <button id="btn-facil" class="btn-modo activo" onclick="cambiarDificultad('facil')">Modo Diario</button>
            <button id="btn-medio" class="btn-modo" onclick="cambiarDificultad('medio')">Modo Medio</button>
            <button id="btn-imposible" class="btn-modo" onclick="cambiarDificultad('imposible')">Modo Imposible</button>
        </div>

        <!-- Instrucciones Dinámicas -->
        <div id="instrucciones-juego" class="instrucciones">
            Selecciona un día del panel inferior para empezar a jugar.
        </div>

        <!-- Aviso Modos No Disponibles -->
        <div id="aviso-modo-bloqueado" class="aviso-bloqueado">
            ⚠️ Este modo estará disponible en próximas actualizaciones. ¡Juga al Modo Diario!
        </div>

        <!-- Calendario de Días -->
     <div id="grid-dias-calendario" class="panel-dias">
            <!-- Los botones del día 1 al 30 se generan automáticamente aquí -->
        </div>

        <!-- Alerta de Victoria -->
        <div id="alerta-victoria" class="alerta-victoria">
            🎉 ¡Excelente! ¡Has acertado el jugador secreto del día! 🎉
        </div>

        <!-- Motor del Buscador de Jugadores -->
        <div id="contenedor-buscador-juego" class="buscador-zona">
            <input type="text" id="buscador" class="input-buscar" placeholder="Escribe el nombre de un jugador de Inazuma..." autocomplete="off">
            <div id="sugerencias" class="sugerencias-caja"></div>
        </div>

        <!-- Tabla donde aparecen las respuestas -->
        <table id="tabla-resultados">
            <thead>
                <tr>
                    <th>Jugador</th>
                    <th>Equipo</th>
                    <th>Posición</th>
                    <th>Elemento</th>
                </tr>
            </thead>
            <tbody id="lista-intentos">
                <!-- Aquí se insertan dinámicamente las filas de los intentos -->
            </tbody>
        </table>
    </div>

    <!-- CONEXIÓN DE LOS CÓDIGOS DIVIDIDOS -->
    <script src="jugadores.js"></script>
    <script src="script.js"></script>

</body>
</html>
